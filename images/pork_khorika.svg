<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241713"/>
      <stop offset="100%" stop-color="#0a090e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="130" fill="#1e1828" stroke="#ff7733" stroke-width="4" filter="url(#glow)"/>
  <!-- Skewers -->
  <path d="M150 250 L450 110" stroke="#e6b800" stroke-width="6" stroke-linecap="round"/>
  <rect x="230" y="190" width="30" height="30" rx="8" fill="#b33600" transform="rotate(-25 230 190)"/>
  <rect x="290" y="160" width="30" height="30" rx="8" fill="#ff7733" transform="rotate(-25 290 160)"/>
  <rect x="350" y="130" width="30" height="30" rx="8" fill="#b33600" transform="rotate(-25 350 130)"/>
  <text x="50%" y="340" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold">Assamese Pork Khorika</text>
  <text x="50%" y="370" dominant-baseline="middle" text-anchor="middle" fill="#ffc107" font-family="sans-serif" font-size="14" letter-spacing="2">CHARCOAL GRILLED SKEWERS</text>
</svg>
