<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1828"/>
      <stop offset="100%" stop-color="#0a090e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="130" fill="#15121e" stroke="#ffc107" stroke-width="4" filter="url(#glow)"/>
  <ellipse cx="300" cy="185" rx="80" ry="50" fill="#802600"/>
  <circle cx="280" cy="180" r="16" fill="#ff5500"/>
  <circle cx="320" cy="190" r="14" fill="#ff7733"/>
  <path d="M295 150 Q300 130 305 150" stroke="#2ecc71" stroke-width="4"/>
  <text x="50%" y="340" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold">Manipuri Pork Thongba</text>
  <text x="50%" y="370" dominant-baseline="middle" text-anchor="middle" fill="#ffc107" font-family="sans-serif" font-size="14" letter-spacing="2">TRADITIONAL HERB CURRY</text>
</svg>
